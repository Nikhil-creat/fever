apiVersion: v1
kind: Service
metadata:
  name: {{ include "fever.fullname" . }}
  labels:
    {{- include "fever.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "fever.selectorLabels" . | nindent 4 }}
